name: Build Quest preview
on:
  push:
    branches: [preview/quest-0.1.15-package-import]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply Quest 0.1.15 patch
        run: git apply Splativerse-Quest-0.1.15-with-package-import.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build dependencies
        run: '$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"'
      - name: Build and verify preview APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          python3 scripts/build.py
          sha256sum --check Splativerse-Quest-preview.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Splativerse-Quest-0.1.15-preview
          path: |
            Splativerse-Quest-preview.apk
            Splativerse-Quest-preview.apk.sha256
          if-no-files-found: error
